<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="main">
    <a href="#">
      <article class="card">
        <img class="card-img" src="assets/images/illustration-article.svg" alt="card illustration">
        <div class="card__content">
          <p class="card__content-category">Learning</p>
          <p class="card__content-publish_date">Published 21 Dec 2023</p>
          <h1 class="card__content-title">HTML & CSS foundations</h1>
          <p class="card__content-text">
            These languages are the backbone of every website, defining structure, content, and presentation.
          </p>
        </div>
        
        <div class="card__author">
          <img src="assets/images/image-avatar.webp" alt="card author avatar" class="card__author-pic">
          <p class="card__author-name">Greg Hooper</p>
        </div>
      </article>
    </a>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Paul Mouliom</a>.
  </footer>
</body>
</html>
